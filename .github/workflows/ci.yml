name: VDN News CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

  build:
    name: Next.js Production Build
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://mock-ci-project.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-ci-anon-key-for-building"
      SUPABASE_SERVICE_ROLE_KEY: "mock-ci-service-role-key"
      NEXT_PUBLIC_RADIO_STREAM_URL: "https://stream.zeno.fm/f3wvbbqmdg8uv"
      NEXT_PUBLIC_SITE_URL: "https://vdnnoticias.pe"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
